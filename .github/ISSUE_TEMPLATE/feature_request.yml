name: Feature request
description: Suggest an idea for Offshoot
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Offshoot stays deliberately small. The best requests describe the problem in your daily workflow, not only the solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
